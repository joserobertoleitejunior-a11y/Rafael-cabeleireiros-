<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<script>
(function () {
  // Autocorreção de cache: o número abaixo muda a cada atualização
  // publicada, e SÓ ISSO decide se vale forçar uma busca nova desta
  // página. Antes isso rodava uma única vez por ABA (sessionStorage): se
  // alguém deixasse a aba aberta entre uma correção e outra, a página
  // nunca mais se atualizava sozinha, mesmo com tudo certo no servidor —
  // por isso uma correção já publicada podia continuar parecendo "não
  // aplicada" pra quem ficou testando na mesma aba o dia todo. Agora
  // compara com a última versão vista (localStorage, sobrevive entre
  // abas): toda vez que sobe uma correção nova, a comparação dá diferente
  // e força uma busca garantidamente nova — com um parâmetro que essa
  // versão específica nunca teve antes — ignorando qualquer cache no
  // caminho (celular, GitHub Pages, proxy).
  var BUILD = '202608b0';
  try {
    if (location.protocol.indexOf('http') !== 0) return;
    if (localStorage.getItem('rafaelBuildSeen') === BUILD) return;
    var u = new URL(location.href);
    if (u.searchParams.get('_r') === BUILD) {
      localStorage.setItem('rafaelBuildSeen', BUILD);
      return;
    }
    u.searchParams.set('_r', BUILD);
    location.replace(u.toString());
  } catch (e) { /* localStorage bloqueado — segue sem forçar */ }
})();
</script>
