<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<script>
(function () {
  // Autocorreção de cache: se o navegador (ou qualquer camada no meio do
  // caminho) ainda estiver mostrando uma versão antiga desta página — o
  // que já vimos acontecer mesmo em aba anônima e com o cache dos
  // arquivos versionado — força UMA busca garantidamente nova, com um
  // parâmetro que nunca existiu antes na URL. Isso ignora qualquer cache
  // (do celular, do GitHub Pages, de qualquer proxy no caminho), porque
  // uma URL nunca vista antes nunca pode estar em cache. Só acontece uma
  // vez por sessão de navegação (sessionStorage), pra não ficar em loop.
  try {
    if (sessionStorage.getItem('rafaelFreshLoad')) return;
    sessionStorage.setItem('rafaelFreshLoad', '1');
    if (location.protocol.indexOf('http') !== 0) return;
    var u = new URL(location.href);
    if (u.searchParams.has('_r')) return;
    u.searchParams.set('_r', Date.now().toString(36));
    location.replace(u.toString());
  } catch (e) { /* sessionStorage bloqueado — segue sem forçar */ }
})();
</script>
